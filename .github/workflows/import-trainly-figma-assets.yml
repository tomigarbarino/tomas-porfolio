name: Import Trainly Figma assets

on:
  push:
    paths:
      - '.github/workflows/import-trainly-figma-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Trainly screenshots from Figma
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/trainly
          curl -fL "https://www.figma.com/api/mcp/asset/0a5908fd-8237-4e70-ab87-4e308d8df461.png" -o public/trainly/campus-ai.png
          curl -fL "https://www.figma.com/api/mcp/asset/cbcb61d7-b056-4299-80e7-8694956b6f38.png" -o public/trainly/capacitar-equipos.png
          curl -fL "https://www.figma.com/api/mcp/asset/df77e019-9131-4553-bca7-1ba7f0c861b1.png" -o public/trainly/metricas-accionables.png
          file public/trainly/*.png

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/trainly/*.png
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Import Trainly screenshots from Figma"
          git push
