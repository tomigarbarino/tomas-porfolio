name: Bundle Trainly assets

on:
  push:
    paths:
      - '.github/workflows/copy-trainly-assets.yml'

permissions:
  contents: write

jobs:
  bundle-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Trainly screenshots into src assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets/trainly
          cp public/trainly/campus-ai.png src/assets/trainly/campus-ai.png
          cp public/trainly/capacitar-equipos.png src/assets/trainly/capacitar-equipos.png
          cp public/trainly/metricas-accionables.png src/assets/trainly/metricas-accionables.png

      - name: Commit bundled assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/trainly/*.png
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Bundle Trainly screenshots for portfolio"
          git push
